# Databricks Asset Bundle — Fabric Audit Agent
# Deploys the read-only capacity-audit sweep as a scheduled job. The task runs `fabric-audit-job`
# (job:run_unified_job), which auto-composes whatever sources are configured: CSV today, and
# List Usages / Workspace Monitoring / REST automatically once their secrets + env vars exist.
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run fabric_audit_sweep -t dev
#
# Uses serverless compute (workspace requirement). Configuration is passed via named_parameters
# on the wheel task; job.py's _merge_named_params_into_env() bridges them into os.environ.

bundle:
  name: fabric-audit-agent

variables:
  catalog:
    description: Unity Catalog catalog holding the bi-fabrics-audit schema.
    default: shakur-main
  schema:
    description: Schema holding the raw + reports Volumes and Delta tables.
    default: bi-fabrics-audit
  schedule_cron:
    description: Quartz cron for the scheduled sweep (default hourly).
    default: "0 0 * * * ?"
  daily_summary_cron:
    description: Quartz cron for the daily capacity digest (default 6pm).
    default: "0 0 18 * * ?"
  daily_summary_tz:
    description: Timezone for the daily digest schedule (6pm local business time).
    default: "America/New_York"
  baseline_cron:
    description: Quartz cron for the nightly user_baseline rebuild (default 02:00 UTC).
    default: "0 0 2 * * ?"

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

resources:
  jobs:
    fabric_audit_sweep:
      name: fabric-audit-sweep
      tasks:
        - task_key: audit
          python_wheel_task:
            package_name: fabric_audit_agent
            entry_point: fabric-audit-job
            named_parameters:
              FABRIC_OUT_DIR: /Volumes/${var.catalog}/${var.schema}/reports/current
              AUDIT_HISTORY_PATH: /Volumes/${var.catalog}/${var.schema}/reports/history/history.json
              FABRIC_DELTA_CATALOG: ${var.catalog}
              FABRIC_DELTA_SCHEMA: ${var.schema}
              FABRIC_TIER2_HEARTBEAT_PATH: /Volumes/${var.catalog}/${var.schema}/reports/tier2_heartbeat.json
              # --- Step 6a: LIVE sources (audit real data, not the static CSV) ---
              FABRIC_TENANT_ID: "{{secrets/fabric-audit/FABRIC_TENANT_ID}}"
              FABRIC_CLIENT_ID: "{{secrets/fabric-audit/FABRIC_CLIENT_ID}}"
              FABRIC_CLIENT_SECRET: "{{secrets/fabric-audit/FABRIC_CLIENT_SECRET}}"
              FABRIC_CAPACITY_EVENTS_CLUSTER: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_CLUSTER}}"
              FABRIC_CAPACITY_EVENTS_DB: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_DB}}"
              FABRIC_CAPACITY_EVENTS_KQL: "CapacityEvents | where ingestion_time() > ago({window}) | extend capacityId=tostring(data.capacityId), windowStartTime=tostring(data.windowStartTime), capacityUnitMs=todouble(data.capacityUnitMs), baseCapacityUnits=todouble(data.baseCapacityUnits) | project capacityId, windowStartTime, capacityUnitMs, baseCapacityUnits"
              FABRIC_CAPACITY_EVENTS_WINDOW: "1d"
              FABRIC_LA_WORKSPACE_ID: "{{secrets/fabric-audit/FABRIC_LA_WORKSPACE_ID}}"
              # --- FIX C: estate-wide security/access detection (external shares, admin grants) via
              # Activity Events. Reachable now with the SP admin grant; feeds the notification center. ---
              FABRIC_SECURITY_ENABLED: "true"
              FABRIC_ORG_DOMAINS: "newellco.com"
              # --- Step 6a: Teams delivery of NEW/material findings (shared audit_alerts dedup) ---
              SWEEP_WEBHOOK_ENABLED: "true"
              POWER_AUTOMATE_ALERT_URL: "{{secrets/fabric-audit/POWER_AUTOMATE_ALERT_URL}}"
              APP_URL: "https://fabric-audit-agent-7405609570261849.9.azure.databricksapps.com"
              FABRIC_LAKEBASE_HOST: "ep-shy-bird-e1gcy0mq.database.eastus2.azuredatabricks.net"
              FABRIC_LAKEBASE_INSTANCE: "fabrics-audit-agent-memory"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              - requests               # webhook POST + Log Analytics
              - msal>=1.24             # SP auth (KQL / LA)
              - azure-kusto-data>=4.0  # Capacity Events KQL
              - psycopg2-binary        # Lakebase alert-chat writer
              - databricks-sdk>=0.81   # Lakebase credential + secret resolution
      # A red run must reach a human. Without this the loud `raise` in
      # baseline_bootstrap_main is decoration: the job goes red at 02:00 UTC and nothing is
      # sent (`_alert_failure` is still a Phase-10 stub that returns False), so the tier2
      # sweep would keep comparing against a stale/empty baseline indefinitely.
      email_notifications:
        on_failure:
          - abdishakur.mohamed@newellco.com
      schedule:
        quartz_cron_expression: ${var.schedule_cron}
        timezone_id: UTC
        pause_status: UNPAUSED

    # ---- Phase 9 Tier 2: cheap deterministic check (no LLM, every 5 minutes) ----
    fabric_audit_tier2:
      name: fabric-audit-tier2
      tasks:
        - task_key: tier2_check
          python_wheel_task:
            package_name: fabric_audit_agent
            entry_point: fabric-audit-tier2
            named_parameters:
              FABRIC_DELTA_CATALOG: ${var.catalog}
              FABRIC_DELTA_SCHEMA: ${var.schema}
              FABRIC_TIER2_HEARTBEAT_PATH: /Volumes/${var.catalog}/${var.schema}/reports/tier2_heartbeat.json
              # Live capacity-events source (so the deterministic gates can fire on real data)
              FABRIC_TENANT_ID: "{{secrets/fabric-audit/FABRIC_TENANT_ID}}"
              FABRIC_CLIENT_ID: "{{secrets/fabric-audit/FABRIC_CLIENT_ID}}"
              FABRIC_CLIENT_SECRET: "{{secrets/fabric-audit/FABRIC_CLIENT_SECRET}}"
              FABRIC_CAPACITY_EVENTS_CLUSTER: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_CLUSTER}}"
              FABRIC_CAPACITY_EVENTS_DB: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_DB}}"
              FABRIC_CAPACITY_EVENTS_KQL: "CapacityEvents | where ingestion_time() > ago({window}) | extend capacityId=tostring(data.capacityId), windowStartTime=tostring(data.windowStartTime), capacityUnitMs=todouble(data.capacityUnitMs), baseCapacityUnits=todouble(data.baseCapacityUnits) | project capacityId, windowStartTime, capacityUnitMs, baseCapacityUnits"
              # Log Analytics per-user attribution (Step 2): the WHO source — unblocks concentration /
              # per-user surge / same-item cross-user gates (without it items=0 and they never fire).
              FABRIC_LA_WORKSPACE_ID: "{{secrets/fabric-audit/FABRIC_LA_WORKSPACE_ID}}"
              # Tier-2 -> Teams alerting (sub-project #2)
              TIER2_WEBHOOK_ENABLED: "true"
              POWER_AUTOMATE_ALERT_URL: "{{secrets/fabric-audit/POWER_AUTOMATE_ALERT_URL}}"
              APP_URL: "https://fabric-audit-agent-7405609570261849.9.azure.databricksapps.com"
              FABRIC_LAKEBASE_HOST: "ep-shy-bird-e1gcy0mq.database.eastus2.azuredatabricks.net"
              FABRIC_LAKEBASE_INSTANCE: "fabrics-audit-agent-memory"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              - requests             # webhook POST
              - msal>=1.24           # SP auth (KQL)
              - azure-kusto-data>=4.0  # Capacity Events KQL
              - psycopg2-binary      # Lakebase chat writer
              - databricks-sdk>=0.81 # Lakebase credential (w.postgres — Autoscaling project)
      # A red run must reach a human. Without this the loud `raise` in
      # baseline_bootstrap_main is decoration: the job goes red at 02:00 UTC and nothing is
      # sent (`_alert_failure` is still a Phase-10 stub that returns False), so the tier2
      # sweep would keep comparing against a stale/empty baseline indefinitely.
      email_notifications:
        on_failure:
          - abdishakur.mohamed@newellco.com
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"   # every 5 minutes
        timezone_id: UTC
        pause_status: UNPAUSED

    # ---- Design A' Phase B (2026-08-09): nightly user_baseline rebuild ----
    # Pulls 14 days of Log Analytics activity and rebuilds per-user + estate-wide p95 into
    # ``user_baseline``. The 5-min tier2 sweep reads whatever this job last wrote. Scheduled
    # 02:00 UTC daily — a full 14-day pull runs in a few minutes on serverless.
    # TIER2_BASELINE_ENABLED is left OFF on the tier2 job until this job has populated the
    # table at least once (see docs/runbooks/deploy-design-a-prime-phase-b.md Stage 4).
    fabric_audit_baseline:
      name: fabric-audit-baseline
      tasks:
        - task_key: baseline_bootstrap
          python_wheel_task:
            package_name: fabric_audit_agent
            entry_point: fabric-audit-baseline
            named_parameters:
              FABRIC_DELTA_CATALOG: ${var.catalog}
              FABRIC_DELTA_SCHEMA: ${var.schema}
              FABRIC_BASELINE_WINDOW: "14d"
              FABRIC_BASELINE_MIN_HISTORY: "20"
              # Log Analytics per-user activity source (same secret bundle the sweep uses)
              FABRIC_TENANT_ID: "{{secrets/fabric-audit/FABRIC_TENANT_ID}}"
              FABRIC_CLIENT_ID: "{{secrets/fabric-audit/FABRIC_CLIENT_ID}}"
              FABRIC_CLIENT_SECRET: "{{secrets/fabric-audit/FABRIC_CLIENT_SECRET}}"
              FABRIC_LA_WORKSPACE_ID: "{{secrets/fabric-audit/FABRIC_LA_WORKSPACE_ID}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              - requests
              - msal>=1.24
              - databricks-sdk>=0.81   # secret resolution; matches the other three stanzas
      # A red run must reach a human. Without this the loud `raise` in
      # baseline_bootstrap_main is decoration: the job goes red at 02:00 UTC and nothing is
      # sent (`_alert_failure` is still a Phase-10 stub that returns False), so the tier2
      # sweep would keep comparing against a stale/empty baseline indefinitely.
      email_notifications:
        on_failure:
          - abdishakur.mohamed@newellco.com
      schedule:
        quartz_cron_expression: ${var.baseline_cron}
        timezone_id: UTC
        pause_status: UNPAUSED

    # ---- Step 10: daily 6pm capacity digest (once-a-day summary card + Acknowledge) ----
    fabric_audit_daily:
      name: fabric-audit-daily
      tasks:
        - task_key: daily_summary
          python_wheel_task:
            package_name: fabric_audit_agent
            entry_point: fabric-audit-daily
            named_parameters:
              FABRIC_DELTA_CATALOG: ${var.catalog}
              FABRIC_DELTA_SCHEMA: ${var.schema}
              # Day high-water CU% / throttle come from a fresh 1d capacity-events collect.
              FABRIC_TENANT_ID: "{{secrets/fabric-audit/FABRIC_TENANT_ID}}"
              FABRIC_CLIENT_ID: "{{secrets/fabric-audit/FABRIC_CLIENT_ID}}"
              FABRIC_CLIENT_SECRET: "{{secrets/fabric-audit/FABRIC_CLIENT_SECRET}}"
              FABRIC_CAPACITY_EVENTS_CLUSTER: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_CLUSTER}}"
              FABRIC_CAPACITY_EVENTS_DB: "{{secrets/fabric-audit/FABRIC_CAPACITY_EVENTS_DB}}"
              FABRIC_CAPACITY_EVENTS_KQL: "CapacityEvents | where ingestion_time() > ago({window}) | extend capacityId=tostring(data.capacityId), windowStartTime=tostring(data.windowStartTime), capacityUnitMs=todouble(data.capacityUnitMs), baseCapacityUnits=todouble(data.baseCapacityUnits) | project capacityId, windowStartTime, capacityUnitMs, baseCapacityUnits"
              FABRIC_LA_WORKSPACE_ID: "{{secrets/fabric-audit/FABRIC_LA_WORKSPACE_ID}}"
              # Daily digest -> Teams delivery + Lakebase (Acknowledge rides the existing alert_ack).
              DAILY_SUMMARY_ENABLED: "true"
              POWER_AUTOMATE_ALERT_URL: "{{secrets/fabric-audit/POWER_AUTOMATE_ALERT_URL}}"
              APP_URL: "https://fabric-audit-agent-7405609570261849.9.azure.databricksapps.com"
              FABRIC_LAKEBASE_HOST: "ep-shy-bird-e1gcy0mq.database.eastus2.azuredatabricks.net"
              FABRIC_LAKEBASE_INSTANCE: "fabrics-audit-agent-memory"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              - requests             # webhook POST
              - msal>=1.24           # SP auth (KQL / LA)
              - azure-kusto-data>=4.0  # Capacity Events KQL
              - psycopg2-binary      # Lakebase chat writer
              - databricks-sdk>=0.81 # Lakebase credential (w.postgres — Autoscaling project)
      # A red run must reach a human. Without this the loud `raise` in
      # baseline_bootstrap_main is decoration: the job goes red at 02:00 UTC and nothing is
      # sent (`_alert_failure` is still a Phase-10 stub that returns False), so the tier2
      # sweep would keep comparing against a stale/empty baseline indefinitely.
      email_notifications:
        on_failure:
          - abdishakur.mohamed@newellco.com
      schedule:
        quartz_cron_expression: ${var.daily_summary_cron}
        timezone_id: ${var.daily_summary_tz}
        pause_status: UNPAUSED

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
