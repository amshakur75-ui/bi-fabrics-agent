[project]
name = "fabric-audit-agent"
version = "0.2.35"
description = "Read-only Fabric/Power BI audit agent — brain, core investigation logic, autonomous jobs, and chat app (Databricks)."
# >=3.10 (not 3.11): the serverless Job compute that installs this wheel runs Python 3.10, and the
# wheel's Requires-Python gates install. The core (fabric_audit_agent) is 3.10-safe; only the
# chat App runtime is 3.11 (it satisfies >=3.10 too).
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "mlflow>=3.10.0",
    "databricks-agents>=1.9.3",
    "databricks-sdk>=0.28",
    "databricks-mcp>=0.1",
    # CAP IS LOAD-BEARING — do not relax to a bare `>=`. mcp 2.0.0 (2026-07-28) is a major
    # rework that DROPPED the deprecated `streamablehttp_client` from mcp.client.streamable_http.
    # databricks-mcp 0.9.0 still imports that name at module level and declares only `mcp>=1.13.0`
    # (no upper bound), so an uncapped resolve pulls v2 and every tool call dies at import with
    # "cannot import name 'streamablehttp_client'". Broke prod 2026-07-30 with zero code changes.
    # Lift to `<3` only after databricks-mcp declares v2 support.
    "mcp>=1.13,<2",
    "requests>=2",
    "python-dotenv>=1.2.1",
    "openpyxl>=3.1",   # export/xlsx_report — native xlsx + charts for the export tool (Phase 5)
]

[project.optional-dependencies]
dev = ["pytest>=7", "tzdata>=2024.1"]   # tzdata: zoneinfo database for timefmt tests on Windows
prod = ["requests>=2", "msal>=1.24", "anthropic>=0.39"]   # collector_rest / clients / reasoner_claude
agent = [                                                   # live sweep + kusto sources
    "requests>=2",
    "msal>=1.24",
    "databricks-sdk>=0.28",
    "databricks-ai-bridge>=0.4",
    "databricks-mcp>=0.1",
    "mlflow>=2.16",
    "azure-kusto-data>=4.0",
]

[project.scripts]
fabric-audit       = "fabric_audit_agent.__main__:_console"
fabric-audit-job   = "fabric_audit_agent.job:job_main"     # Databricks wheel-task entry (unified sweep)
fabric-audit-tier2 = "fabric_audit_agent.job:tier2_main"   # Phase 9 Tier 2: cheap deterministic check
fabric-audit-daily = "fabric_audit_agent.job:daily_summary_main"  # Step 10: daily 6pm capacity digest
fabric-audit-baseline = "fabric_audit_agent.job:baseline_bootstrap_main"  # B1: nightly user_baseline rebuild
fabric-audit-watch = "fabric_audit_agent.watch_run:main"   # autonomous 5-min watcher (Job entry)
start-app          = "agent_server.start_app:main"
start-server       = "agent_server.start_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# NEVER add a top-level `scripts` package here. It was added 2026-08-09 22:13 UTC so the App's
# `start-app` entry point could resolve `scripts.start_app:main`, and it took every Databricks
# JOB down from 23:55 UTC until 2026-08-10 05:20 UTC — ~5.5 hours of no capacity alerting.
# Databricks' own Python shell does `from scripts.db_ipykernel_launcher_wrapper import ...`
# against its internal /databricks/python_shell/scripts/; a top-level `scripts` on the wheel
# SHADOWS it, so the Python kernel dies at startup with ERROR_RESTART_PYTHON and the task never
# reaches our code. `start_app` now lives at `agent_server.start_app` — a namespaced package
# that cannot collide. Keep every shipped package under a distinctive top-level name.
include = ["fabric_audit_agent*", "agent_server*"]

# Ship the grounded KQL template catalog INSIDE the wheel. Without this, setuptools excludes
# the non-.py file and `_load_query_library` finds nothing in the installed package (prod), so
# `query_library` returns 0 templates even though run_kql's firewall is present. (Local tests pass
# because they read the source tree, not the wheel.)
[tool.setuptools.package-data]
# `data/plugin/catalog/**` is the grounded FIELD catalog (manifest + per-model field lists,
# ~7.7 MB across 16 files, largest 1.6 MB). Without it the wheel installs but every JOB logs
#   preflight degraded: catalog-manifest: manifest.json not found at <site-packages>/...
# and `resolve/catalog.py` silently resolves nothing, so field/measure grounding is dead in
# production while the local checkout works fine (the files ARE in the repo — this was purely
# a packaging gap, found 2026-08-10). The App is unaffected either way because it deploys from
# the synced source path, not the wheel. NOTE: this is the catalog OUTPUT; the 14 MB
# `enriched-field-catalog.json` INPUT stays out of the package (repo-root plugin-source/).
fabric_audit_agent = [
    "query_library.json",
    "data/plugin/catalog/*.json",
    "data/plugin/catalog/models/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
